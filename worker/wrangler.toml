name = "codelab-asistente"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# IA gratuita de Cloudflare (Workers AI)
[ai]
binding = "AI"

# Base de datos gratuita (D1): negocios, conversaciones y contactos
[[d1_databases]]
binding = "DB"
database_name = "codelab-asistente"
database_id = "49cfa94e-4132-406c-a850-69ae89a3bf8f"
jurisdiction = "eu"

[vars]
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
FALLBACK_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

# Limpieza diaria de las conversaciones de los negocios de demostración
[triggers]
crons = ["0 3 * * *"]

# El widget y el panel se sirven como texto
[[rules]]
type = "Text"
globs = ["**/*.client.js", "**/*.html"]
fallthrough = false

# Contraseña del panel (secreto, no aquí):  npx wrangler secret put ADMIN_PASSWORD
